name: xrpl_flutter_sdk
description: "The first native Flutter/Dart SDK for the XRP Ledger (XRPL). Pure Dart, no platform channels. Payments, DEX, tokenization and account security."
version: 0.1.3-dev
homepage: https://github.com/nemorixgroup/xrpl-flutter-sdk
repository: https://github.com/nemorixgroup/xrpl-flutter-sdk
issue_tracker: https://github.com/nemorixgroup/xrpl-flutter-sdk/issues

topics:
  - xrp
  - xrpl
  - ripple
  - blockchain
  - flutter

platforms:
  android:
  ios:
  macos:
  windows:
  linux:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  cryptography: ^2.9.0    # Ed25519
  flutter:
    sdk: flutter
  http: ^1.2.1
  meta: ^1.15.0
  pointycastle: ^4.0.0    # secp256k1 + hashes (SHA-256, RIPEMD160)

dev_dependencies:
  build_runner: ^2.4.9
  coverage: ^1.7.2
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  very_good_analysis: ^10.3.0
